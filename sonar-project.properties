# SQL migrations are declarative, idempotent evidence fixtures. Their repeated
# source/case/claim table shape is required to make every dossier independently
# replayable; CPD cannot distinguish that schema repetition from copied logic.
# Deterministic migration renderers repeat canonical dossier/source shapes by
# design; parity tests compare their output byte-for-byte with the reviewed JSON
# and SQL artifacts. Keep both SQL and renderer logic in normal analysis, while
# excluding those generated/repetitive payload surfaces from CPD density only.
sonar.cpd.exclusions=migrations/**/*.sql,scripts/render-*-migration.mjs
