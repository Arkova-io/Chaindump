# SQL migrations are declarative, idempotent evidence fixtures. Their repeated
# source/case/claim table shape is required to make every dossier independently
# replayable; CPD cannot distinguish that schema repetition from copied logic.
# Deterministic migration renderers repeat canonical dossier/source shapes by
# design; parity tests compare their output byte-for-byte with the reviewed JSON
# and SQL artifacts. Keep both SQL and renderer logic in normal analysis, while
# excluding those generated/repetitive payload surfaces from CPD density only.
sonar.cpd.exclusions=migrations/*.sql,migrations/**/*.sql,scripts/render-*-migration.mjs

# Generated SQLite migrations embed canonical JSON research fixtures. Repeated
# JSON keys and SQL JSON-path literals are data-schema requirements rather than
# maintainability defects, which PL/SQL rule S1192 cannot distinguish. Suppress
# only that rule on migration SQL; every file remains analyzed for every other
# issue and remains covered by replay, parity, and statement-size tests.
sonar.issue.ignore.multicriteria=generatedMigrationSqlLiterals
sonar.issue.ignore.multicriteria.generatedMigrationSqlLiterals.ruleKey=plsql:S1192
sonar.issue.ignore.multicriteria.generatedMigrationSqlLiterals.resourceKey=migrations/0062_chain_causal_completion.sql
