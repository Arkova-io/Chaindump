name: Deploy

# Continuous delivery for the chaindump Worker. Merging to main is the ONLY path
# to production — this replaces the old "whoever runs `wrangler deploy` last wins"
# footgun, where prod could silently run an unmerged branch (CLAUDE.md §3.2).
#
# Flow: push to main -> re-run the test suite -> WAIT for a human to approve the
# `production` environment -> apply D1 migrations -> wrangler deploy.
# The human gate lives in the GitHub `production` environment (required reviewer),
# which additionally only permits deploys from protected branches.
#
# Requires one repo secret: CLOUDFLARE_API_TOKEN (Workers + D1 edit). Use the GCP
# secret `Chaindump_Cloudflare` — the older cloudflare-api-token lacks D1 and fails.
#
# Node 22: wrangler's package engines require >=22, so the deploy runtime must be
# 22 or `npx wrangler` fails after the approval gate. Actions pinned to SHAs.
on:
  push:
    branches: [main]
  workflow_dispatch: # manual redeploy of main from the Actions tab

permissions:
  contents: read

concurrency:
  # A production approval is revision-specific. If a newer main arrives while
  # an older run is waiting for approval, cancel the stale run so it cannot hold
  # this concurrency slot forever or be approved after it has been superseded.
  group: deploy-production
  cancel-in-progress: true

jobs:
  verify:
    # Gate: prod only deploys code whose tests pass on main. Also a belt-and-braces
    # guard so a manual (workflow_dispatch) run can never target a non-main ref.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: node scripts/check-migrations.mjs

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The required-reviewer gate. GitHub pauses here until a reviewer approves.
    environment:
      name: production
      url: https://chaindump.xyz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # Apply any new D1 migrations BEFORE the Worker that depends on them ships.
      # Idempotent: already-applied migrations are skipped.
      - name: Apply D1 migrations (remote)
        run: npx wrangler d1 migrations apply chaindump-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Reject a superseded main revision
        # Environment approval can outlive the revision that requested it.
        # Re-read main immediately before publishing so an older approved run
        # cannot roll production back after a newer main deploy.
        run: |
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main
          current_main_sha="$(git rev-parse refs/remotes/origin/main)"
          test "$GITHUB_SHA" = "$current_main_sha"
      - name: Deploy Worker
        # The health route returns this revision so the smoke test can reject a
        # healthy-but-stale Worker rather than treating any historical 200 as good.
        run: npx wrangler deploy --var "BUILD_SHA:${GITHUB_SHA}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Post-deploy smoke check
        # Give the edge a moment to propagate (~5-15s per CLAUDE.md §3.2), then
        # prove the exact revision, Worker APIs, seeded exchange cohort and the
        # four-link Forensics shell are all live before calling the deploy good.
        run: |
          sleep 20
          node scripts/smoke-production.mjs \
            --base https://chaindump.xyz \
            --revision "$GITHUB_SHA" \
            --attempts 5 \
            --delay 10000
