# SonarCloud Automatic Analysis ignores sonar-project.properties. These exact
# renderers are deterministic research manifests: their repeated dossier shapes
# generate byte-compared SQL and are not executable production implementation.
# Keep the files analyzed for issues while excluding only payload repetition
# from copy/paste density. Automatic Analysis does not support wildcard paths,
# so generated migrations must be named explicitly.
sonar.cpd.exclusions=migrations/0057_nft_forensic_wave_a.sql,migrations/0058_nft_forensic_normalization.sql,migrations/0059_exchange_forensic_wave_a.sql,migrations/0060_exchange_cex_causal_wave_b.sql,scripts/render-nft-forensic-wave-a-migration.mjs,scripts/render-exchange-forensic-wave-a-migration.mjs,scripts/render-exchange-cex-causal-wave-b-migration.mjs

# Automatic Analysis reads this file instead of sonar-project.properties.
# Generated SQLite migrations embed canonical JSON fixtures, so repeated JSON
# keys and JSON-path literals are schema data that PL/SQL rule S1192 cannot
# model. Ignore only S1192 on migration SQL; retain all other issue analysis.
sonar.issue.ignore.multicriteria=generatedMigrationSqlLiterals
sonar.issue.ignore.multicriteria.generatedMigrationSqlLiterals.ruleKey=plsql:S1192
sonar.issue.ignore.multicriteria.generatedMigrationSqlLiterals.resourceKey=migrations/**/*.sql
